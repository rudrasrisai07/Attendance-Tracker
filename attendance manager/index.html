<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>College Attendance Manager</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="space-background"></div>

    <div class="container">

        <header>

            <h1 class="glow-text">
                ATTENDANCE MANAGER
            </h1>

            <div class="mission-controls glass-card">

                <div class="date-picker-group">

                    <label for="start-date">
                        START DATE
                    </label>

                    <input
                        type="date"
                        id="start-date"
                    >

                </div>

                <nav class="toggle-container">

                    <button
                        id="btn-classes"
                        class="glow-btn active">
                        CLASSES
                    </button>

                    <button
                        id="btn-labs"
                        class="glow-btn">
                        LABS
                    </button>

                </nav>

            </div>

        </header>

        <main id="dashboard">

            <div class="edit-toolbar glass-card">

                <button
                    id="btn-edit"
                    class="glow-btn">
                    EDIT MODE : OFF
                </button>

                <div
                    id="edit-controls"
                    class="hidden">

                    <button
                        id="btn-add-subject"
                        class="glow-btn">
                        + ADD SUBJECT
                    </button>

                    <button
                        id="btn-add-week"
                        class="glow-btn">
                        + ADD WEEK
                    </button>

                </div>

            </div>

            <div
                id="attendance-wrapper"
                class="glass-card table-scroll-container">

                <table id="attendance-table">

                    <thead>

                        <tr id="row-weeks"></tr>

                        <tr id="row-dates"></tr>

                        <tr id="row-days"></tr>

                    </thead>

                    <tbody id="table-body"></tbody>

                </table>

            </div>

            <h2 class="glow-text mini">
                ATTENDANCE PROGRESS
            </h2>

            <section
                id="charts-container"
                class="charts-grid">
            </section>

        </main>

    </div>
    <script src="script.js"></script>

</body>

</html>
