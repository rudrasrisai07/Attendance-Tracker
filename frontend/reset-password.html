<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password — Attendance Manager 2.0</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>
    <!-- Theme Toggle in top-right corner -->
    <div class="theme-corner-toggle">
        <button id="btn-theme-toggle" class="glow-btn" onclick="ThemeManager.toggleTheme()" title="Toggle Theme">
            🌙 Dark Mode
        </button>
    </div>

    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-header">
                <div class="auth-icon-badge">🔐</div>
                <h1 class="gradient-text">Reset Password</h1>
                <p class="auth-subtitle">Establish a secure new password for your account</p>
            </div>

            <div id="auth-alert" class="alert-box" style="display: none;"></div>

            <!-- Form shown when a valid token is present -->
            <form id="reset-password-form" class="auth-form">
                <input type="hidden" id="reset-token" value="">

                <div class="form-group">
                    <label for="reset-new-password">New Password</label>
                    <div class="input-container">
                        <input
                            type="password"
                            id="reset-new-password"
                            class="auth-input"
                            placeholder="Minimum 6 characters"
                            required
                            autocomplete="new-password"
                        >
                        <button
                            type="button"
                            class="password-toggle-btn"
                            data-target="reset-new-password"
                            title="Show/Hide Password"
                        >👁️</button>
                    </div>
                    <div class="strength-meter">
                        <div id="strength-bar" class="strength-bar"></div>
                    </div>
                    <span class="input-hint">Must be at least 6 characters</span>
                </div>

                <div class="form-group">
                    <label for="reset-confirm-password">Confirm New Password</label>
                    <div class="input-container">
                        <input
                            type="password"
                            id="reset-confirm-password"
                            class="auth-input"
                            placeholder="Re-enter new password"
                            required
                            autocomplete="new-password"
                        >
                        <button
                            type="button"
                            class="password-toggle-btn"
                            data-target="reset-confirm-password"
                            title="Show/Hide Password"
                        >👁️</button>
                    </div>
                </div>

                <button type="submit" id="reset-submit-btn" class="auth-submit-btn">
                    Set New Password
                </button>
            </form>

            <div id="token-missing-box" class="token-error-view" style="display: none;">
                <p style="color: var(--text-muted); font-size: 14px; margin-bottom: 20px;">
                    This password reset link is invalid or incomplete. Please request a new password reset link.
                </p>
                <a href="login.html?action=forgot" class="glow-btn" style="display: inline-block; text-decoration: none; text-align: center; width: 100%;">
                    Request New Reset Link
                </a>
            </div>

            <div class="auth-footer">
                Remember your password?
                <a href="login.html" class="auth-link">Back to Sign In</a>
            </div>
        </div>
    </div>

    <script src="js/theme.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
